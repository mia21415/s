<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>miahosting - פאנל ניהול בוטים</title>
    <style>
        :root {
            --bg-main: #0b0b0e;
            --bg-sidebar: #121216;
            --bg-card: #18181f;
            --accent: #ff007f;
            --accent-hover: #e60073;
            --neon-glow: 0 0 15px rgba(255, 0, 127, 0.45);
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --danger: #ff3366;
            --success: #00ffcc;
            --warning: #ffaa00;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            border-left: 1px solid rgba(255, 0, 127, 0.25);
            box-shadow: 5px 0 25px rgba(0,0,0,0.6);
        }

        .logo-area h2 {
            color: var(--accent);
            text-shadow: var(--neon-glow);
            margin: 0 0 5px 0;
            font-size: 26px;
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-links li {
            padding: 12px 15px;
            border-radius: 8px;
            background-color: var(--bg-card);
            color: var(--text-main);
            font-weight: bold;
            cursor: pointer;
            border: 1px solid rgba(255, 0, 127, 0.3);
            transition: all 0.25s ease;
        }

        .nav-links li:hover, .nav-links li.active {
            border-color: var(--accent);
            box-shadow: var(--neon-glow);
            transform: translateX(-4px);
        }

        .logout-btn {
            background-color: rgba(255, 51, 102, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 51, 102, 0.3);
        }
        .logout-btn:hover {
            background-color: var(--danger);
            color: #fff;
        }

        .footer-brand {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid #222;
            padding-top: 15px;
        }

        .footer-brand span {
            color: var(--accent);
            font-weight: bold;
            text-shadow: var(--neon-glow);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f1f27;
            padding-bottom: 15px;
        }

        h1 { margin: 0; font-size: 26px; }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: var(--neon-glow);
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
        }

        .btn-secondary {
            background-color: #252530;
            box-shadow: none;
            border: 1px solid #3a3a48;
        }
        .btn-secondary:hover { background-color: #323240; }

        .btn-danger {
            background-color: var(--danger);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
        }
        .btn-danger:hover { background-color: #e02855; }

        /* Bots Grid */
        .bots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .bot-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 0, 127, 0.25);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
        }

        .bot-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px rgba(255, 0, 127, 0.25);
        }

        .bot-card-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bot-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            object-fit: cover;
            background-color: #222;
        }

        .bot-card h3 { margin: 0; font-size: 18px; color: #fff; }

        .status-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }

        .status-online { background: rgba(0, 255, 204, 0.12); color: var(--success); border: 1px solid rgba(0, 255, 204, 0.3); }
        .status-offline { background: rgba(255, 170, 0, 0.12); color: var(--warning); border: 1px solid rgba(255, 170, 0, 0.3); }

        .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }

        /* Manage View */
        .manage-card {
            background-color: var(--bg-sidebar);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 0, 127, 0.3);
            max-width: 600px;
        }

        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }

        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 11px;
            margin-bottom: 15px;
            background-color: var(--bg-main);
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: var(--accent); box-shadow: var(--neon-glow); }

        .console-box {
            background-color: #050507;
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 10px;
            padding: 15px;
            font-family: monospace;
            font-size: 13px;
            color: #00ffcc;
            height: 180px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            margin-top: 10px;
            white-space: pre-wrap;
            direction: ltr;
            text-align: left;
        }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: var(--bg-sidebar); padding: 25px; border-radius: 12px; width: 360px;
            border: 1px solid var(--accent); box-shadow: var(--neon-glow);
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- תפריט צדדי -->
    <div class="sidebar">
        <div class="logo-area">
            <h2>miahosting</h2>
            <p id="userWelcome">שלום</p>
            <ul class="nav-links">
                <li class="active" onclick="showHome()">🏠 מסך הבית</li>
                <li onclick="openCreateModal()">➕ Create Bot</li>
                <li class="logout-btn" onclick="logout()">🚪 התנתק (Logout)</li>
            </ul>
        </div>
        <div class="footer-brand">
            Powered by <span>miahosting</span>
        </div>
    </div>

    <!-- תוכן מרכזי -->
    <div class="main-content">
        
        <!-- מסך הבית -->
        <div id="homeView">
            <div class="top-bar">
                <div>
                    <h1>הבוטים שלי</h1>
                    <p style="color: var(--text-muted); margin: 4px 0 0 0;">הבוטים המשויכים למשתמש שלך</p>
                </div>
                <button onclick="openCreateModal()">+ Create Bot</button>
            </div>
            <div id="botsList" class="bots-grid" style="margin-top: 20px;"></div>
        </div>

        <!-- מסך ניהול בוט -->
        <div id="manageView" style="display: none;">
            <div class="top-bar" style="align-items: center;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <img id="manageBotAvatar" class="bot-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar" style="width: 60px; height: 60px;">
                    <div>
                        <h1 id="manageBotTitle">שם הבוט</h1>
                        <p id="manageBotFolder" style="color: var(--text-muted); margin: 4px 0 0 0; font-size: 12px;"></p>
                    </div>
                </div>
                <button class="btn-secondary" onclick="showHome()">חזרה למסך הבית ⬅</button>
            </div>

            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <div class="manage-card" style="flex: 1; min-width: 320px;">
                    <h3 style="margin-top: 0; color: var(--accent);">הגדרות בוט והעלאת קבצים</h3>
                    <form id="deployForm">
                        <label>קובץ הבוט (ZIP): <span id="fileStatus" style="color: var(--success); font-size: 12px;"></span></label>
                        <input type="file" id="botFile" accept=".zip">

                        <label>Discord Bot Token:</label>
                        <input type="text" id="botToken" placeholder="הדבק טוקן כאן..." required>

                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                            <button type="submit" id="deployBtn">🚀 שמור והפעל</button>
                            <button type="button" class="btn-danger" onclick="deleteCurrentBot()">🗑️ מחק בוט</button>
                        </div>
                    </form>
                </div>

                <div style="flex: 1; min-width: 320px; display: flex; flex-direction: column;">
                    <h3 style="margin: 0 0 5px 0; color: var(--success); font-size: 16px;">💻 Live Console Output</h3>
                    <div id="consoleOutput" class="console-box">ממתין לנתוני הפעלה מהשרת...</div>
                </div>
            </div>
        </div>

    </div>

    <!-- מודל יצירה -->
    <div class="modal-overlay" id="createModal">
        <div class="modal-box">
            <h2 style="margin-top: 0; color: var(--accent);">יצירת בוט חדש</h2>
            <p style="color: var(--text-muted); font-size: 13px;">הזן שם לפרויקט (תיווצר לו תיקייה משלו).</p>
            <input type="text" id="newBotName" placeholder="שם הבוט..." autofocus>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeCreateModal()">ביטול</button>
                <button onclick="createNewBot()">Create</button>
            </div>
        </div>
    </div>

    <script>
        let allBots = [];
        let currentBotId = null;
        let consoleInterval = null;

        async function checkUser() {
            const res = await fetch('/api/user');
            const data = await res.json();
            if (!data.loggedIn) {
                window.location.href = '/login.html';
            } else {
                document.getElementById('userWelcome').innerText = `שלום, ${data.username}`;
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        async function loadBots() {
            await checkUser();
            const res = await fetch('/api/bots');
            allBots = await res.json();
            renderHome();
        }

        function renderHome() {
            const container = document.getElementById('botsList');
            container.innerHTML = '';

            if (allBots.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 50px; background: var(--bg-sidebar); border-radius: 12px; border: 1px dashed #333;">
                        <h3 style="color: var(--text-muted);">אין כרגע בוטים למשתמש זה</h3>
                        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 15px;">לחץ על יצירת בוט חדש כדי להתחיל</p>
                        <button onclick="openCreateModal()">+ Create Bot</button>
                    </div>
                `;
                return;
            }

            allBots.forEach(bot => {
                const isRunning = bot.status === 'running';
                const avatarUrl = bot.avatar && bot.avatar.startsWith('http') ? bot.avatar : 'https://cdn.discordapp.com/embed/avatars/0.png';
                const card = document.createElement('div');
                card.className = 'bot-card';
                card.onclick = () => openManageBot(bot.id);
                card.innerHTML = `
                    <div class="bot-card-header">
                        <img src="${avatarUrl}" class="bot-avatar" alt="Bot">
                        <div>
                            <h3>${bot.name}</h3>
                            <span class="status-badge ${isRunning ? 'status-online' : 'status-offline'}">
                                <span class="dot"></span>
                                ${isRunning ? 'פעיל 24/7' : 'ממתין לקבצים'}
                            </span>
                        </div>
                    </div>
                    <div style="color: var(--text-muted); font-size: 12px; margin-top: 15px; display: flex; justify-content: space-between;">
                        <span>תיקייה: /${bot.id}</span>
                        <span style="color: var(--accent);">ניהול ➔</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openCreateModal() {
            document.getElementById('newBotName').value = '';
            document.getElementById('createModal').style.display = 'flex';
        }
        function closeCreateModal() {
            document.getElementById('createModal').style.display = 'none';
        }

        async function createNewBot() {
            const name = document.getElementById('newBotName').value.trim();
            if (!name) return alert('נא להזין שם');

            const res = await fetch('/api/bots/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            const data = await res.json();
            if (data.success) {
                closeCreateModal();
                await loadBots();
                openManageBot(data.bot.id);
            }
        }

        function openManageBot(id) {
            const bot = allBots.find(b => b.id === id);
            if (!bot) return;

            currentBotId = id;
            document.getElementById('manageBotTitle').innerText = bot.name;
            document.getElementById('manageBotAvatar').src = (bot.avatar && bot.avatar.startsWith('http')) ? bot.avatar : 'https://cdn.discordapp.com/embed/avatars/0.png';
            document.getElementById('manageBotFolder').innerText = `נתיב: extracted_bots/${bot.id}`;
            document.getElementById('botToken').value = bot.token || '';
            document.getElementById('botFile').value = '';

            const fileStatusEl = document.getElementById('fileStatus');
            if (bot.hasFiles) {
                fileStatusEl.innerText = '(קובץ קיים בשרת)';
            } else {
                fileStatusEl.innerText = '(נדרש קובץ ZIP)';
            }

            document.getElementById('homeView').style.display = 'none';
            document.getElementById('manageView').style.display = 'block';

            startConsoleStream(id);
        }

        function showHome() {
            currentBotId = null;
            if (consoleInterval) clearInterval(consoleInterval);
            document.getElementById('manageView').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
            loadBots();
        }

        function startConsoleStream(id) {
            if (consoleInterval) clearInterval(consoleInterval);
            const box = document.getElementById('consoleOutput');
            
            const fetchLogs = async () => {
                try {
                    const res = await fetch(`/api/bots/${id}/logs`);
                    const data = await res.json();
                    box.innerText = data.logs || 'אין לוגים כרגע...';
                    box.scrollTop = box.scrollHeight;
                } catch (e) {}
            };

            fetchLogs();
            consoleInterval = setInterval(fetchLogs, 800);
        }

        document.getElementById('deployForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentBotId) return;

            const fileInput = document.getElementById('botFile').files[0];
            const token = document.getElementById('botToken').value.trim();
            const btn = document.getElementById('deployBtn');

            const formData = new FormData();
            if (fileInput) formData.append('file', fileInput);
            formData.append('token', token);

            btn.innerText = 'מעלה ומפעיל...';
            btn.disabled = true;

            try {
                const res = await fetch(`/api/bots/${currentBotId}/deploy`, {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();
                if (data.success) {
                    alert('הפעולה התחילה! תראה את ההתקדמות בלייב בחלון ה-Console משמאל.');
                    loadBots();
                    setTimeout(loadBots, 3000);
                } else {
                    alert('שגיאה: ' + data.message);
                }
            } catch (err) {
                alert('שגיאת תקשורת עם השרת');
            } finally {
                btn.innerText = '🚀 שמור והפעל';
                btn.disabled = false;
            }
        });

        async function deleteCurrentBot() {
            if (!currentBotId) return;
            if (!confirm('למחוק את הבוט לצמיתות?')) return;
            if (consoleInterval) clearInterval(consoleInterval);

            await fetch(`/api/bots/${currentBotId}`, { method: 'DELETE' });
            showHome();
        }

        loadBots();
    </script>
</body>
</html>
