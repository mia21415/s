<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>התחברות - פאנל ניהול בוטים</title>
    <style>
        /* כאן אפשר לשנות עיצובים וצבעים של עמוד הלוגין אם תרצה */
        body { background: #1e1f22; color: #fff; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #2b2d31; padding: 30px; border-radius: 10px; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; text-align: center; color: #5865f2; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #1e1f22; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #5865f2; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #4752c4; }
        #error { color: #f23f42; text-align: center; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>כניסה לפאנל</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="שם משתמש" required>
            <input type="password" id="password" placeholder="סיסמה" required>
            <button type="submit">התחבר</button>
            <div id="error"></div>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = '/dashboard.html';
            } else {
                document.getElementById('error').innerText = data.message;
            }
        });
    </script>
</body>
</html>
