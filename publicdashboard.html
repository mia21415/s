<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול בוטים 24/7</title>
    <style>
        /* כאן אפשר לעצב מחדש את נראות הדשבורד אם תרצה */
        body { background: #1e1f22; color: #dbdee1; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3f4147; padding-bottom: 15px; margin-bottom: 20px; }
        .card { background: #2b2d31; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 10px; margin: 8px 0 15px; background: #1e1f22; border: 1px solid #3f4147; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .btn { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: #fff; }
        .btn-primary { background: #5865f2; }
        .btn-success { background: #23a559; }
        .btn-warning { background: #f0b232; color: #000; }
        .btn-danger { background: #da373c; }
        .bot-item { background: #313338; padding: 15px; border-radius: 6px; margin-bottom: 12px; }
        .bot-top { display: flex; justify-content: space-between; align-items: center; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .online { background: rgba(35, 165, 89, 0.2); color: #23a559; }
        .offline { background: rgba(218, 55, 60, 0.2); color: #da373c; }
        .logs { background: #111214; color: #00ff66; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 4px; margin-top: 10px; max-height: 120px; overflow-y: auto; direction: ltr; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>פאנל אירוח בוטים (מחובר: mia)</h2>
            <button class="btn btn-danger" onclick="logout()">התנתק</button>
        </div>

        <div class="card">
            <h3>הוספת בוט חדש</h3>
            <form id="createForm">
                <label>שם הבוט (לזיהוי בפאנל):</label>
                <input type="text" id="botName" placeholder="לדוגמה: בוט טיקטים" required>
                
                <label>Discord Bot Token:</label>
                <input type="password" id="botToken" placeholder="הדבק כאן את הטוקן..." required>
                
                <label>קבצי הבוט (קובץ ZIP או מספר קבצים):</label>
                <input type="file" id="botFiles" multiple required>
                
                <button type="submit" class="btn btn-primary" id="submitBtn">העלה והפעל בוט</button>
            </form>
        </div>

        <div class="card">
            <h3>הבוטים שלך</h3>
            <div id="botsList">טוען...</div>
        </div>
    </div>

    <script>
        async function loadBots() {
            const res = await fetch('/api/bots');
            if (res.status === 401) return window.location.href = '/login.html';
            const bots = await res.json();
            
            const list = document.getElementById('botsList');
            if (bots.length === 0) {
                list.innerHTML = '<p>אין בוטים פעילים כרגע.</p>';
                return;
            }

            list.innerHTML = bots.map(bot => `
                <div class="bot-item">
                    <div class="bot-top">
                        <div>
                            <strong>${bot.name}</strong>
                            <span class="status ${bot.isRunning ? 'online' : 'offline'}">
                                ${bot.isRunning ? 'פעיל 24/7' : 'כבוי'}
                            </span>
                        </div>
                        <div>
                            <button class="btn ${bot.isRunning ? 'btn-warning' : 'btn-success'}" onclick="toggleBot('${bot.id}')">
                                ${bot.isRunning ? 'כבה בוט' : 'הפעל בוט'}
                            </button>
                            <button class="btn btn-danger" onclick="deleteBot('${bot.id}')">מחק</button>
                        </div>
                    </div>
                    <div class="logs">${(bot.logs || []).join('<br>') || 'אין לוגים להצגה...'}</div>
                </div>
            `).join('');
        }

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'מתקין חבילות ומפעיל...';

            const formData = new FormData();
            formData.append('name', document.getElementById('botName').value);
            formData.append('token', document.getElementById('botToken').value);
            
            const files = document.getElementById('botFiles').files;
            for (let i = 0; i < files.length; i++) {
                formData.append('files', files[i]);
            }

            const res = await fetch('/api/bots', { method: 'POST', body: formData });
            if (res.ok) {
                document.getElementById('createForm').reset();
                loadBots();
            } else {
                alert('אירעה שגיאה בהעלאת הבוט');
            }
            btn.disabled = false;
            btn.innerText = 'העלה והפעל בוט';
        });

        async function toggleBot(id) {
            await fetch(`/api/bots/${id}/toggle`, { method: 'POST' });
            loadBots();
        }

        async function deleteBot(id) {
            if (!confirm('בטוח שברצונך למחוק את הבוט לצמיתות?')) return;
            await fetch(`/api/bots/${id}`, { method: 'DELETE' });
            loadBots();
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        loadBots();
        setInterval(loadBots, 4000); // <--- כאן קובעים באיזו תדירות (במילישניות) הדשבורד מתרענן אוטומטית (4000 = 4 שניות)
    </script>
</body>
</html>
